<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0c11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caisse">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Burger Co. — Caisse</title>
<style>
  :root {
    --bg: #0a0c11;
    --surface: #131720;
    --surface-2: #1a1f2b;
    --surface-3: #232a38;
    --border: #272e3d;
    --text: #eef0f6;
    --muted: #8a92a6;
    --accent: #ff6a2b;
    --accent-2: #ffb340;
    --accent-soft: rgba(255,106,43,.14);
    --ok: #2fd27a;
    --danger: #ff4d5e;
    --info: #4aa3ff;
    --radius: 18px;
    --cart-w: 390px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text);
    color-scheme: dark;
    overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  body {
    background:
      radial-gradient(900px 420px at 85% -10%, rgba(255,106,43,.10), transparent 60%),
      radial-gradient(700px 380px at -10% 0%, rgba(255,179,64,.06), transparent 60%),
      var(--bg);
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    display: flex; flex-direction: column;
  }
  input, select { user-select: text; -webkit-user-select: text; font-family: inherit; color: var(--text); background: var(--surface-2); }
  input::placeholder { color: #5d657a; }
  input:focus, select:focus { outline: none; border-color: var(--accent) !important; box-shadow: 0 0 0 3px var(--accent-soft); }
  button { font-family: inherit; transition: transform .12s ease, background .2s ease, opacity .2s; }
  button:active { transform: scale(.97); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* HEADER */
  header {
    position: sticky; top: 0; z-index: 30;
    background: rgba(10,12,17,.78);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    color: var(--text);
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  header > div:last-child { flex-wrap: wrap; justify-content: flex-end; }
  .logo { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo-icon {
    width: 40px; height: 40px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius: 12px; display: grid; place-items: center; font-size: 22px;
    box-shadow: 0 6px 18px rgba(255,106,43,.35);
  }
  .logo h1 { font-size: 17px; font-weight: 800; letter-spacing: .6px; white-space: nowrap; }
  .logo p { font-size: 10px; color: var(--muted); letter-spacing: 1.5px; margin-top: 1px; }

  .mode-switch { display: none; align-items: center; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); padding: 3px; border-radius: 14px; }
  .mode-switch.show { display: flex; }
  .mode-btn { border: none; background: transparent; color: var(--muted); padding: 7px 12px; border-radius: 11px; font-size: 11px; font-weight: 800; letter-spacing: .5px; cursor: pointer; }
  .mode-btn.active { background: linear-gradient(135deg, var(--accent), #ff8a4d); color: #fff; box-shadow: 0 4px 12px rgba(255,106,43,.35); }
  .header-settings-btn, .header-journal-btn {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    border-radius: 12px; padding: 9px 12px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .header-journal-btn:hover, .header-settings-btn:hover { background: var(--surface-3); }

  /* TABS */
  .tabs {
    display: flex; gap: 8px; padding: 10px 14px; overflow-x: auto; scrollbar-width: none;
    background: transparent; border-bottom: 1px solid var(--border);
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0; padding: 9px 16px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .tab:hover { color: var(--text); background: var(--surface-2); }
  .tab.active { background: linear-gradient(135deg, var(--accent), #ff8a4d); border-color: transparent; color: #fff; box-shadow: 0 6px 16px rgba(255,106,43,.32); }

  /* PRODUITS */
  .products { flex: 1; overflow-y: auto; padding: 16px 14px 130px; -webkit-overflow-scrolling: touch; }
  .category-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin: 6px 4px 14px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px; position: relative; overflow: hidden; cursor: pointer;
    transition: transform .15s ease, border-color .2s, box-shadow .2s;
  }
  .card:hover { border-color: rgba(255,106,43,.5); box-shadow: 0 10px 30px rgba(0,0,0,.35); transform: translateY(-2px); }
  .card:active { transform: scale(.97); }
  .card-img {
    height: 84px; border-radius: 13px; display: grid; place-items: center; font-size: 42px; margin-bottom: 10px;
    background: radial-gradient(circle at 30% 20%, rgba(255,179,64,.35), transparent 60%), linear-gradient(135deg, #2a2230, #1b1f2c);
    border: 1px solid var(--border);
  }
  .card-name { font-size: 14px; font-weight: 700; margin-bottom: 4px; line-height: 1.25; }
  .card-desc { font-size: 11px; color: var(--muted); margin-bottom: 10px; line-height: 1.35; min-height: 29px; }
  .card-bottom { display: flex; justify-content: space-between; align-items: center; }
  .card-price { font-size: 16px; font-weight: 800; color: var(--accent-2); }
  .add-btn {
    width: 34px; height: 34px; border-radius: 11px; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #ff8a4d); color: #fff;
    font-size: 20px; font-weight: 700; display: grid; place-items: center;
    box-shadow: 0 4px 12px rgba(255,106,43,.35);
  }

  /* PANIER */
  .cart {
    position: fixed; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom));
    width: min(430px, calc(100% - 28px));
    background: rgba(19,23,32,.92); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--border); border-radius: 22px;
    box-shadow: 0 18px 50px rgba(0,0,0,.6);
    padding: 12px 14px; z-index: 20;
    transition: all .3s cubic-bezier(.4,0,.2,1);
  }
  .cart:not(.open) { width: auto; min-width: 200px; padding: 11px 16px; border-radius: 999px; cursor: pointer; }
  .cart:not(.open) .cart-handle, .cart:not(.open) .cart-items, .cart:not(.open) .pay-btn,
  .cart:not(.open) .cart-order-name, .cart:not(.open) .cancel-edit-btn { display: none; }
  .cart:not(.open) .cart-header { border-bottom: none; padding-bottom: 0; gap: 16px; }
  .cart-handle { width: 42px; height: 4px; background: var(--surface-3); border-radius: 3px; margin: 0 auto 10px; }
  .cart-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .cart-title { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .cart-count { background: var(--accent); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 800; }
  .cart-total { font-size: 18px; font-weight: 800; color: var(--accent-2); }
  .cart-order-name { padding: 10px 0 4px; }
  .cart-order-name label { display: block; font-size: 10px; font-weight: 700; margin-bottom: 5px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .cart-order-name input { width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 16px; }
  .cart-items { max-height: 190px; overflow-y: auto; margin: 4px 0 12px; }
  .cart-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .cart-item:last-child { border-bottom: none; }
  .cart-item-emoji { width: 38px; height: 38px; flex-shrink: 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: 11px; display: grid; place-items: center; font-size: 20px; }
  .cart-item-info { flex: 1; min-width: 0; }
  .cart-item-name { font-size: 13px; font-weight: 600; }
  .cart-item-price { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .cart-item-price b { color: var(--text); }
  .qty-ctrl { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
  .qty-btn { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-3); border: none; font-weight: 700; font-size: 15px; cursor: pointer; color: var(--text); }
  .qty-btn.minus { color: var(--danger); }
  .qty-btn.plus { color: var(--ok); }
  .qty-val { font-size: 13px; font-weight: 700; min-width: 16px; text-align: center; }
  .empty-cart { text-align: center; padding: 22px; color: var(--muted); font-size: 13px; }
  .cancel-edit-btn { width: 100%; border: 1px solid rgba(255,77,94,.35); border-radius: 12px; padding: 9px; margin-bottom: 8px; background: rgba(255,77,94,.12); color: var(--danger); font-weight: 800; font-size: 12px; cursor: pointer; }
  .pay-btn {
    width: 100%; padding: 16px 18px; border: none; border-radius: 16px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #ff8a4d); color: #fff;
    font-size: 15px; font-weight: 800; letter-spacing: .5px;
    box-shadow: 0 8px 24px rgba(255,106,43,.4);
    display: flex; justify-content: space-between; align-items: center;
  }
  .pay-btn:disabled { background: var(--surface-3); color: var(--muted); box-shadow: none; cursor: not-allowed; }

  /* MODALS */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(4,6,10,.7);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: none; align-items: flex-end; justify-content: center; z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .modal-bg.show { display: flex; animation: fadeIn .22s; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-bottom: none;
    width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto;
    border-radius: 26px 26px 0 0;
    padding: 24px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow: 0 -20px 60px rgba(0,0,0,.5);
    animation: slideUp .3s cubic-bezier(.4,0,.2,1);
  }
  @keyframes slideUp { from{transform:translateY(60px);opacity:0} to{transform:translateY(0);opacity:1} }
  .modal h2 { font-size: 20px; margin-bottom: 4px; }
  .modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .summary { background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 16px; }
  .summary-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 6px; color: var(--muted); }
  .summary-row.total { font-size: 18px; font-weight: 800; color: var(--text); padding-top: 10px; border-top: 1px dashed var(--border); margin-top: 8px; }
  .summary-row.total span:last-child { color: var(--accent-2); }
  .modal-actions { display: flex; gap: 10px; }
  .btn-cancel, .btn-confirm { flex: 1; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 700; border: none; cursor: pointer; }
  .btn-cancel { background: var(--surface-3); color: var(--text); }
  .btn-confirm { background: linear-gradient(135deg, var(--accent), #ff8a4d); color: #fff; box-shadow: 0 6px 18px rgba(255,106,43,.35); }

  .supp-options { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin: 16px 0; }
  .supp-option { border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 14px; padding: 16px; text-align: center; font-weight: 800; font-size: 15px; cursor: pointer; }
  .supp-option:hover { border-color: var(--accent); }
  .supp-list { max-height: 270px; overflow-y: auto; margin: 12px 0 18px; }
  .supp-add { display: flex; width: 100%; justify-content: space-between; align-items: center; border: 1px solid var(--border); border-radius: 13px; background: var(--surface-2); color: var(--text); padding: 12px 14px; margin-bottom: 7px; font-weight: 700; cursor: pointer; }
  .supp-add b { color: var(--accent-2); }
  .supp-add.active { background: var(--accent-soft); border-color: var(--accent); }

  .quick-calc-btn { width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 11px; margin: 10px 0 14px; background: var(--surface-2); color: var(--text); font-weight: 700; cursor: pointer; }
  .order-name-field label { display: block; font-size: 11px; font-weight: 700; margin-bottom: 6px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .order-name-field input { width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 12px; font-size: 16px; }
  .payment-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .payment-option { border: 1px solid var(--border); border-radius: 13px; padding: 13px 4px; background: var(--surface-2); color: var(--muted); font-weight: 800; font-size: 12px; cursor: pointer; }
  .payment-option.active { background: var(--accent-soft); color: var(--accent-2); border-color: var(--accent); }
  .cash-payment-box { display: none; margin: 10px 0; padding: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; }
  .cash-payment-box.show { display: block; }
  .cash-payment-label { font-size: 11px; font-weight: 800; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .cash-payment-input { width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 12px; font-size: 20px; font-weight: 800; text-align: right; background: var(--bg); }
  .cash-result { margin-top: 10px; padding: 11px; border-radius: 12px; background: var(--bg); font-size: 15px; font-weight: 900; text-align: center; color: var(--muted); }
  .cash-result.change { color: var(--ok); }
  .cash-result.missing { color: var(--danger); }

  .mini-calculator-overlay { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(4,6,10,.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); align-items: center; justify-content: center; padding: 20px; }
  .mini-calculator-overlay.show { display: flex; animation: fadeIn .2s; }
  .mini-calculator { width: min(340px,100%); background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 16px; box-shadow: 0 24px 60px rgba(0,0,0,.6); }
  .mini-calculator-title { font-size: 16px; font-weight: 800; margin-bottom: 10px; }
  .calculator-display { width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 13px; font-size: 22px; text-align: right; margin-bottom: 10px; background: var(--bg); }
  .calculator-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
  .calculator-grid button { border: 0; border-radius: 12px; padding: 14px 5px; font-size: 16px; font-weight: 800; background: var(--surface-3); color: var(--text); cursor: pointer; }
  .calculator-grid button[data-calc="/"], .calculator-grid button[data-calc="*"], .calculator-grid button[data-calc="-"], .calculator-grid button[data-calc="+"] { background: var(--accent-soft); color: var(--accent-2); }
  .calculator-grid button[data-calc="C"] { color: var(--danger); }
  .calculator-grid .calculator-equals { grid-column: 1 / -1; background: linear-gradient(135deg, var(--accent), #ff8a4d); color: #fff; }
  .calculator-close { width: 100%; border: 0; border-radius: 12px; padding: 12px; margin-top: 10px; background: var(--surface-3); color: var(--text); font-weight: 700; cursor: pointer; }

  .success { text-align: center; padding: 20px 0; }
  .success-icon { width: 80px; height: 80px; background: linear-gradient(135deg, var(--ok), #1fa65e); border-radius: 50%; margin: 0 auto 16px; display: grid; place-items: center; font-size: 40px; color: #fff; box-shadow: 0 10px 30px rgba(47,210,122,.4); animation: pop .4s cubic-bezier(.175,.885,.32,1.275); }
  @keyframes pop { from{transform:scale(0)} to{transform:scale(1)} }
  .success h2 { color: var(--ok); margin-bottom: 6px; }
  .success p { color: var(--muted); font-size: 13px; }

  .toast { position: fixed; top: calc(16px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%) translateY(-220px); background: var(--surface-3); color: var(--text); border: 1px solid var(--border); padding: 11px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; z-index: 20000; transition: transform .3s; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: 90%; text-align: center; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* RÉGLAGES */
  .settings, .journal { padding: 4px 2px; }
  .settings-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .settings-title { font-size: 22px; font-weight: 800; margin-bottom: 16px; }
  .settings-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--border); }
  .settings-row:last-child { border-bottom: none; }
  .settings-label { font-size: 13px; font-weight: 700; }
  .settings-value { font-size: 12px; color: var(--muted); }
  .settings-input { width: 130px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; }
  .settings-btn { border: none; border-radius: 12px; padding: 10px 14px; font-weight: 800; cursor: pointer; }
  .product-admin-row { display: grid; grid-template-columns: minmax(0,1fr) 74px 74px auto; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .product-admin-row:last-child { border-bottom: none; }
  .product-admin-input, .supp-admin-input { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 9px; font-size: 13px; }
  .product-admin-cat { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .product-admin-actions { display: flex; gap: 5px; }
  .product-admin-btn, .supp-admin-btn { border: 0; border-radius: 10px; padding: 9px 10px; font-size: 12px; font-weight: 800; cursor: pointer; color: var(--text); }
  .product-admin-edit { background: var(--surface-3); }
  .product-admin-delete, .supp-admin-delete { background: rgba(255,77,94,.18); color: var(--danger); }
  .product-admin-add, .supp-admin-add { width: 100%; border: 1px dashed var(--border); border-radius: 13px; padding: 12px; background: var(--surface-2); color: var(--accent-2); font-weight: 800; cursor: pointer; margin-top: 10px; }
  .product-admin-add:hover, .supp-admin-add:hover { border-color: var(--accent); }
  .product-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .product-form label { font-size: 11px; font-weight: 700; color: var(--muted); }
  .product-form input, .product-form select { width: 100%; margin-top: 4px; padding: 10px; border: 1px solid var(--border); border-radius: 10px; }
  .product-form .full { grid-column: 1/-1; }
  .supp-admin-list { margin-top: 12px; }
  .supp-admin-row { display: grid; grid-template-columns: minmax(0,1fr) 90px auto; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  #newProductForm { background: var(--surface-2); }

  /* JOURNAL */
  .accounting-summary { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin: 0 0 16px; }
  .accounting-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; }
  .accounting-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .acc-count { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .acc-paid { background: linear-gradient(135deg, rgba(47,210,122,.16), rgba(47,210,122,.04)); border-color: rgba(47,210,122,.45); }
  .acc-paid .acc-count { background: rgba(47,210,122,.18); color: var(--ok); }
  .acc-paid .accounting-card-value { color: var(--ok); }
  .acc-pending { background: linear-gradient(135deg, rgba(255,77,94,.17), rgba(255,77,94,.04)); border-color: rgba(255,77,94,.45); }
  .acc-pending .acc-count { background: rgba(255,77,94,.18); color: var(--danger); }
  .acc-pending .accounting-card-value { color: var(--danger); }
  .acc-picked { grid-column: 1 / -1; }
  .accounting-card-label { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .accounting-card-value { font-size: 22px; font-weight: 900; margin-top: 5px; }
  .pay-split { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); display: grid; gap: 4px; }
  .pay-split-row { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
  .pay-split-row b { color: var(--text); font-weight: 800; }
  .pay-split-row small { font-size: 10px; }
  .accounting-card-sub { font-size: 10px; color: var(--muted); margin-top: 4px; line-height: 1.4; }

      ${fields.map(f => `<div class="order-name-field" style="margin:10px 0"><label>${esc(f.label)}</label><input data-dlg="${esc(f.id)}" type="${f.type || 'text'}" ${f.step ? `step="${f.step}"` : ''} ${f.type === 'number' ? 'inputmode="decimal"' : ''} value="${esc(f.value ?? '')}" placeholder="${esc(f.placeholder || '')}"></div>`).join('')}
      <div class="modal-actions" style="margin-top:14px">
        ${buttons.map((b, i) => `<button type="button" class="${b.cls || 'btn-cancel'}" data-dlg-btn="${i}">${esc(b.label)}</button>`).join('')}
      </div>`;
    const done = v => { bg.classList.remove('show'); bg.onclick = null; resolve(v); };
    bg.onclick = e => {
      if (e.target === bg) return done(null);
      const btn = e.target.closest('[data-dlg-btn]'); if (!btn) return;
      const b = buttons[Number(btn.dataset.dlgBtn)];
      if (fields.length && b.value === true) {
        const out = {};
        bg.querySelectorAll('[data-dlg]').forEach(inp => { out[inp.dataset.dlg] = inp.value; });
        return done(out);
      }
      done(b.value);
    };
    bg.classList.add('show');
    setTimeout(() => {
      const f = bg.querySelector('[data-dlg]') || $('dlgText');
      if (f) { f.focus(); if (f.id === 'dlgText') f.select(); }
    }, 60);
  });
}

const cartItems = () => [...cart.values()];

const cartKey = (p, supps, mode = '') => String(p.id) + '|' + supps.map(s => String(s.id)).sort().join(',') + '|' + mode;

function addProductToCart(p, supplements = []) {
  if (!p) return;
  const mode = (p.cat === 'burger' || p.cat === 'wrap') ? orderMode : '';
  const base = Number(mode === 'menu' && p.menuPrice != null ? p.menuPrice : p.price) || 0;
  const supps = Array.isArray(supplements) ? supplements : [];
  const finalPrice = round2(base + supps.reduce((s, x) => s + (Number(x.price) || 0), 0));
  const key = cartKey(p, supps, mode);
  const existing = cart.get(key);
  if (existing) existing.qty += 1;
  else cart.set(key, { key, product: p, mode, qty: 1, selectedPrice: finalPrice, supplements: supps });
  renderCart();
  $('cart').classList.add('open');
  showToast(p.name + ' ajouté');
}

function changeQty(key, delta) {
  const item = cart.get(key);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) cart.delete(key);
  renderCart();
}

function subLine(i) {
  const parts = [];
  if (i.mode) parts.push(`<span class="mode-tag">${modeName(i.mode)}</span>`);
  if (i.supplements.length) parts.push('+ ' + esc(i.supplements.map(s => s.name).join(', ')));
  return parts.length ? `<div style="font-size:11px;color:var(--muted);margin-top:3px">${parts.join(' · ')}</div>` : '';
}

/* ---------- CALCULATRICE ---------- */
function evalExpr(raw) {
  const expr = String(raw).replace(/,/g, '.').replace(/\s/g, '');
  if (!expr || !/^[0-9+\-*/().]+$/.test(expr)) throw new Error('bad');
  const tokens = expr.match(/\d+(?:\.\d*)?|\.\d+|[+\-*/()]/g) || [];
  if (tokens.join('') !== expr) throw new Error('bad');
  const values = [], ops = [];
  const prec = { '+':1, '-':1, '*':2, '/':2 };
  const apply = () => {
    const op = ops.pop(), b = values.pop(), a = values.pop();
    if (a === undefined || b === undefined) throw new Error('bad');
    if (op === '+') values.push(a + b);
    else if (op === '-') values.push(a - b);
    else if (op === '*') values.push(a * b);
    else { if (b === 0) throw new Error('div0'); values.push(a / b); }
  };
  let expectValue = true;
  for (const t of tokens) {
    if (/^[\d.]/.test(t)) { values.push(Number(t)); expectValue = false; }
    else if (t === '(') { ops.push(t); expectValue = true; }
    else if (t === ')') {
      while (ops.length && ops[ops.length - 1] !== '(') apply();
      if (ops.pop() !== '(') throw new Error('bad');
      expectValue = false;
    } else {
      if (expectValue) { if (t === '-') values.push(0); else throw new Error('bad'); }
      while (ops.length && ops[ops.length - 1] !== '(' && prec[ops[ops.length - 1]] >= prec[t]) apply();
      ops.push(t);
      expectValue = true;
    }
  }
  while (ops.length) { if (ops[ops.length - 1] === '(') throw new Error('bad'); apply(); }
  if (values.length !== 1 || !Number.isFinite(values[0])) throw new Error('bad');
  return round2(values[0]);
}

}

function copyText(text) {
  // 1) API moderne (HTTPS)  2) repli execCommand, compatible iOS en contexte non sécurisé
  const legacy = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    let okc = false;
    try { okc = document.execCommand('copy'); } catch {}
    ta.remove();
    return okc;
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(() => true, () => legacy());
  }
  return Promise.resolve(legacy());
}

function showShareFallback(title, text, copiedMsg, reason) {
  const bg = $('dialogBg');
  const canShare = typeof navigator.share === 'function';
  const hint = reason === 'unsupported'
    ? 'La feuille de partage de l’iPhone n’est pas disponible dans ce mode d’ouverture de la page (elle demande une page en https ou ajoutée à l’écran d’accueil). Vous pouvez copier le texte.'
    : 'Le partage n’a pas pu s’ouvrir. Appuyez sur « Partager » pour réessayer, ou copiez le texte.';
  $('dialogContent').innerHTML = `
    <h2>📤 Partager</h2>
    <p class="modal-sub" style="margin-top:6px">${esc(hint)}</p>
    <textarea class="dlg-text" readonly rows="6">${esc(text)}</textarea>
    <div class="modal-actions" style="margin-top:14px">
      <button type="button" class="btn-cancel" data-sh="close">Fermer</button>
      <button type="button" class="${canShare ? 'btn-cancel' : 'btn-confirm'}" data-sh="copy">Copier</button>
      ${canShare ? '<button type="button" class="btn-confirm" data-sh="share">Partager</button>' : ''}
    </div>`;
  bg.onclick = e => {
    if (e.target === bg) { bg.classList.remove('show'); bg.onclick = null; return; }
    const b = e.target.closest('[data-sh]'); if (!b) return;
    const act = b.dataset.sh;
    if (act === 'close') { bg.classList.remove('show'); bg.onclick = null; }
    else if (act === 'share') {
      // appel direct dans le geste de l'utilisateur
      navigator.share({ title, text }).then(() => { bg.classList.remove('show'); bg.onclick = null; }, err => {
        if (!err || err.name !== 'AbortError') showToast('Partage indisponible, utilisez Copier');
      });
    } else if (act === 'copy') {
      copyText(text).then(okc => showToast(okc ? copiedMsg : 'Copie impossible, sélectionnez le texte'));
    }
  };
  bg.classList.add('show');
}

// IMPORTANT : navigator.share doit être appelé synchronement dans le clic (exigence iOS/Safari).
function shareText(title, text, copiedMsg) {
  if (typeof navigator.share !== 'function') { showShareFallback(title, text, copiedMsg, 'unsupported'); return; }
  navigator.share({ title, text }).catch(err => {
    if (err && err.name === 'AbortError') return;
    showShareFallback(title, text, copiedMsg, 'failed');
  });
}

function cashStepDialog(o) {
  return new Promise(resolve => {
    const bg = $('dialogBg');
    $('dialogContent').innerHTML = `
      <h2>💵 Paiement en espèces</h2>
      <p class="modal-sub" style="margin-top:6px">Commande ${esc(fmtNum(o.number))}${o.name ? ' · ' + esc(o.name) : ''}</p>
      <div class="summary" style="margin-bottom:12px">
        <div class="summary-row total" style="border-top:none;margin-top:0;padding-top:0"><span>À payer</span><span>${fmt(o.total)}</span></div>
      </div>
      <div class="cash-payment-label">Montant remis</div>
      <input id="rcvCash" class="cash-payment-input" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0,00">
      <div class="cash-quick" id="rcvQuick"></div>
      <div id="rcvResult" class="cash-result">Monnaie à rendre : 0,00 €</div>
      <div class="summary" id="rcvDetail" style="margin:12px 0 0;display:none">
        <div class="summary-row"><span>Total</span><span>${fmt(o.total)}</span></div>
        <div class="summary-row"><span>Remis</span><span id="rcvGiven"></span></div>
        <div class="summary-row total"><span id="rcvLbl">À rendre</span><span id="rcvDiff"></span></div>
      </div>
      <div class="modal-actions" style="margin-top:14px">
        <button type="button" class="btn-cancel" data-rcv="cancel">Annuler</button>
        <button type="button" class="btn-confirm" data-rcv="ok" id="rcvOk">Valider</button>
      </div>`;
    const inp = $('rcvCash');
    const exact = round2(o.total);
    const quick = [exact, 10, 20, 50];
    $('rcvQuick').innerHTML = quick.map((v, i) => `<button type="button" data-rcv-amt="${v}">${i === 0 ? 'Exact' : fmt(v)}</button>`).join('');
    const val = () => Number(String(inp.value || '').replace(',', '.')) || 0;
    const update = () => {
      const received = val(), diff = round2(received - o.total), r = $('rcvResult'), d = $('rcvDetail');
      d.style.display = received ? '' : 'none';
      $('rcvGiven').textContent = fmt(received);
      if (!received) { r.className = 'cash-result'; r.textContent = 'Monnaie à rendre : 0,00 €'; }
      else if (diff >= 0) { r.className = 'cash-result change'; r.textContent = 'Monnaie à rendre : ' + fmt(diff); $('rcvLbl').textContent = 'Monnaie à rendre'; $('rcvDiff').textContent = fmt(diff); }
      else { r.className = 'cash-result missing'; r.textContent = 'Il manque : ' + fmt(-diff); $('rcvLbl').textContent = 'Il manque'; $('rcvDiff').textContent = fmt(-diff); }
      $('rcvOk').disabled = received < o.total;
    };
    const done = v => { bg.classList.remove('show'); bg.onclick = null; resolve(v); };
    inp.addEventListener('input', update);
    update();
    bg.onclick = e => {
      if (e.target === bg) return done(null);
      const q = e.target.closest('[data-rcv-amt]');
      if (q) { inp.value = q.dataset.rcvAmt; update(); return; }
      const b = e.target.closest('[data-rcv]'); if (!b) return;
      if (b.dataset.rcv === 'cancel') return done(null);
      const received = val();
      if (received < o.total) return;
      done({ received: round2(received), change: round2(received - o.total) });
    };
    bg.classList.add('show');
    setTimeout(() => inp.focus(), 60);
  });
}

async function payReceptionOrder(i) {
  const o = journal[i];
  if (!o || o.payment !== RECEPTION) return;
  const r = await appDialog({
    title: 'Règlement', message: `Commande ${fmtNum(o.number)} — ${fmt(o.total)}`,
    buttons: [{ label: 'Annuler', value: null }, { label: '💳 Carte', value: 'card', cls: 'btn-confirm' }, { label: '💵 Espèces', value: 'cash', cls: 'btn-confirm' }]
  });
  if (!r || journal[i] !== o) return;
  if (r === 'cash') {
    const c = await cashStepDialog(o);
    if (!c || journal[i] !== o) return;
    o.cashReceived = c.received;
    o.change = c.change;
  }
  o.payment = PAY_LABELS[r];
  saveJournal(); renderJournal();
  showToast(r === 'cash' ? `Commande ${fmtNum(o.number)} payée · à rendre ${fmt(o.change)}` : `Commande ${fmtNum(o.number)} payée`);
}

async function editOrder(i) {
  const o = journal[i]; if (!o) return;
  if (cart.size && editingOrderIndex === null && !(await appConfirm('Modifier cette commande', 'La commande en cours sera remplacée.', 'Remplacer'))) return;
  cart.clear();
  o.items.forEach(item => {
    const product = PRODUCTS.find(p => String(p.id) === String(item.productId))
      || PRODUCTS.find(p => p.name === item.name)
      || { id: 'old_' + item.name, name: item.name, emoji: '🍽️', desc: '', price: item.price, cat: 'side' };
    const supplements = (item.supplements || []).map(n =>
      SUPPLEMENTS.find(s => s.name === n) || { id: 'old_' + n, name: n, price: 0 });
    const mode = item.mode || '';
    const key = cartKey(product, supplements, mode);
    // item.price contient déjà base + suppléments au moment de la vente
    cart.set(key, { key, product, mode, qty: item.qty, selectedPrice: item.price, supplements });
  });
  editingOrderIndex = i;
  $('cartOrderName').value = o.name || '';
  currentCat = 'burger';
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.cat === 'burger'));
  renderProducts();
  renderCart();
  $('cart').classList.add('open');
  showToast(`Modification de ${fmtNum(o.number)}`);
}

      <button type="button" class="btn-cancel" data-act="share">📤 Partager</button>
    </div>
    <div class="modal-actions" style="margin-top:10px">
      ${tel ? `<a class="btn-cancel" href="tel:${esc(tel)}" style="text-decoration:none;display:flex;align-items:center;justify-content:center">📞 Appeler</a>` : ''}
      <button type="button" class="btn-confirm" data-act="close">Fermer</button>
    </div>`;
  $('cardModalBg').classList.add('show');
}

function cardText() {
  const c = getCard();
  return [settings.restaurantName, c.tagline, '', ...cardLines(c).map(([ic, t]) => ic + ' ' + t), c.note ? '' : null, c.note || null]
    .filter(x => x !== null && x !== undefined).join('\n').trim();
}

function saveCard(patch) {
  settings.card = Object.assign(getCard(), patch);
  persist('burgerCoSettings', settings);
  applySettings();
}

function readCardForm() {
  const g = id => ($(id)?.value || '').trim();
  return {
    logoEmoji: g('cardLogoEmoji') || CARD_DEFAULT.logoEmoji,
    tagline: g('cardTagline'), phone: g('cardPhone'), address: g('cardAddress'),
    hours: g('cardHours'), email: g('cardEmail'), social: g('cardSocial'),
    note: g('cardNote'), color: safeColor($('cardColor')?.value)
  };
}

function cardSettingsHTML() {
  const c = getCard();
  const prev = c.logo ? `<img class="card-logo-prev" src="${esc(c.logo)}" alt="">` : `<span class="card-logo-prev">${esc(c.logoEmoji)}</span>`;
  return `
    <div class="settings-card">
      <div class="settings-label">Carte de visite</div>
      <div class="settings-value" style="margin:4px 0 14px">Touchez le nom du restaurant en haut de l'écran pour l'afficher.</div>
      <div class="card-form">
        <div class="card-logo-row">
          ${prev}
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <label class="product-admin-btn card-file-btn">Choisir un logo<input id="cardLogoFile" type="file" accept="image/*" hidden></label>
            ${c.logo ? '<button type="button" class="product-admin-btn product-admin-delete" id="cardLogoRemove">Retirer</button>' : ''}
          </div>
        </div>
        <label>Emoji (utilisé si pas de logo)<input id="cardLogoEmoji" maxlength="4" value="${esc(c.logoEmoji)}"></label>
        <label>Slogan<input id="cardTagline" maxlength="60" value="${esc(c.tagline)}" placeholder="Burgers &amp; wraps maison"></label>
        <label>Téléphone<input id="cardPhone" type="tel" value="${esc(c.phone)}" placeholder="+590 6 90 00 00 00"></label>
        <label>Adresse<input id="cardAddress" value="${esc(c.address)}" placeholder="Rue, ville"></label>
        <label>Horaires<input id="cardHours" value="${esc(c.hours)}" placeholder="Mar–Dim · 11h–22h"></label>
        <label>E-mail<input id="cardEmail" type="email" value="${esc(c.email)}" placeholder="contact@exemple.fr"></label>
        <label>Réseaux / site web<input id="cardSocial" value="${esc(c.social)}" placeholder="@burgerco · burgerco.fr"></label>
        <label>Message<textarea id="cardNote" rows="2" maxlength="140" placeholder="Merci de votre visite !">${esc(c.note)}</textarea></label>
        <label>Couleur de la carte<input id="cardColor" type="color" value="${safeColor(c.color)}"></label>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button type="button" class="settings-btn btn-cancel" id="cardPreview" style="flex:1">Aperçu</button>
        <button type="button" class="settings-btn btn-confirm" id="cardSave" style="flex:1">Enregistrer la carte</button>
      </div>
    </div>`;
}

function handleLogoFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = 160, cv = document.createElement('canvas');
      cv.width = cv.height = s;
      const m = Math.min(img.width, img.height);
      cv.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
      saveCard(Object.assign(readCardForm(), { logo: cv.toDataURL('image/jpeg', 0.85) }));
      renderSettings();
      showToast('Logo enregistré');
    };
    img.onerror = () => showToast('Image illisible');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function bindCardSettings() {
  $('cardSave').addEventListener('click', () => { saveCard(readCardForm()); showToast('Carte enregistrée'); });
  $('cardPreview').addEventListener('click', () => { saveCard(readCardForm()); openCard(); });
  $('cardLogoFile').addEventListener('change', e => handleLogoFile(e.target.files[0]));
  const rm = $('cardLogoRemove');
  if (rm) rm.addEventListener('click', () => { saveCard(Object.assign(readCardForm(), { logo: '' })); renderSettings(); });
}

/* ---------- ÉVÉNEMENTS ---------- */
$('products').addEventListener('click', e => {
  const j = e.target.closest('[data-jact]');
  if (j) {
    const i = Number(j.dataset.i);
    switch (j.dataset.jact) {
      case 'ticket': openTicket(i); break;
      case 'edit': editOrder(i); break;
      case 'pay': payReceptionOrder(i); break;
      case 'pickup': markOrderPickedUp(i); break;
      case 'delete': deleteOrder(i); break;
      case 'share-accounting': shareText('Résumé comptable', buildAccountingText(), 'Résumé comptable copié'); break;
    }
    return;
  }
  const card = e.target.closest('.card');
  if (!card) return;
  const p = PRODUCTS.find(x => String(x.id) === String(card.dataset.id));
  if (!p) return;
  if (p.cat === 'burger' || p.cat === 'wrap') openSuppModal(p);
  else addProductToCart(p, []);
});

$('suppContent').addEventListener('click', e => {
  const supp = e.target.closest('[data-supp]');
  if (supp) {
    const s = SUPPLEMENTS.find(x => String(x.id) === supp.dataset.supp);
    if (!s) return;
    const idx = pendingSupps.findIndex(x => x.id === s.id);
    if (idx >= 0) pendingSupps.splice(idx, 1); else pendingSupps.push(s);
    renderSuppList();
    return;
  }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (!act) return;
  const p = pendingProduct;
  if (act === 'yes') renderSuppList();
  else if (act === 'no') { closeSuppModal(); addProductToCart(p, []); }
  else if (act === 'ok') { const list = pendingSupps.slice(); closeSuppModal(); addProductToCart(p, list); }
  else if (act === 'cancel') closeSuppModal();
});
$('suppModalBg').addEventListener('click', e => { if (e.target === $('suppModalBg')) closeSuppModal(); });

$('cartItems').addEventListener('click', e => {
  const btn = e.target.closest('.qty-btn');
  if (btn) changeQty(btn.dataset.key, Number(btn.dataset.d));
});
$('cart').addEventListener('click', e => {
  if (e.target.closest('.qty-btn') || e.target.closest('.pay-btn') || e.target.closest('input') || e.target.closest('.cancel-edit-btn')) return;
  const open = $('cart').classList.contains('open');
  if (open && !e.target.closest('.cart-header')) return;
  $('cart').classList.toggle('open');
});
$('cartOrderName').addEventListener('input', () => { $('orderName').value = $('cartOrderName').value; });
$('orderName').addEventListener('input', () => { $('cartOrderName').value = $('orderName').value; });
$('cancelEditBtn').addEventListener('click', () => { resetOrderState(); showToast('Modification annulée'); });

$('tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (!t) return;
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  currentCat = t.dataset.cat;
  renderProducts();
  $('products').scrollTo({ top: 0, behavior: 'smooth' });
});

$('modeSwitch').addEventListener('click', e => {
  const btn = e.target.closest('.mode-btn'); if (!btn || btn.dataset.mode === orderMode) return;
  document.querySelectorAll('.mode-btn').forEach(x => x.classList.toggle('active', x === btn));
  orderMode = btn.dataset.mode;
  renderProducts();
  showToast(orderMode === 'menu' ? 'Mode MENU sélectionné' : 'Mode SEUL sélectionné');
});

$('settingsHeaderBtn').addEventListener('click', () => {
  currentCat = 'settings';
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  renderProducts();
  $('modeSwitch').classList.remove('show');
  $('products').scrollTo({ top: 0 });
});
$('journalHeaderBtn').addEventListener('click', openJournalTab);

$('payBtn').addEventListener('click', openModal);
$('cancelBtn').addEventListener('click', closeModal);
$('confirmBtn').addEventListener('click', confirmPay);
$('cashReceived').addEventListener('input', updateCashResult);
$('cashQuick').addEventListener('click', e => {
  const b = e.target.closest('[data-cash-amt]'); if (!b) return;
  $('cashReceived').value = b.dataset.cashAmt;
  updateCashResult();
});
$('quickCalcBtn').addEventListener('click', openCalculator);
$('modalBg').addEventListener('click', e => {
  if (e.target === $('modalBg')) { closeModal(); return; }
  const pay = e.target.closest('[data-pay]');
  if (pay) { setPayMethod(pay.dataset.pay); return; }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'new') { closeModal(); renderProducts(); }
  else if (act === 'journal') { closeModal(); openJournalTab(); }
});

$('closeCalculator').addEventListener('click', closeCalculator);
$('calculatorModal').addEventListener('click', e => {
  if (e.target === $('calculatorModal')) { closeCalculator(); return; }
  const k = e.target.closest('[data-calc]');
  if (k) calcKey(k.dataset.calc);
});

$('homeBtn').addEventListener('click', () => {
  currentCat = 'burger';
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.cat === 'burger'));
  renderProducts();
  $('products').scrollTo({ top: 0 });
});

$('logoBtn').addEventListener('click', openCard);
$('logoBtn').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCard(); } });
$('cardModalBg').addEventListener('click', e => {
  if (e.target === $('cardModalBg')) { $('cardModalBg').classList.remove('show'); return; }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'close') $('cardModalBg').classList.remove('show');
  else if (act === 'share') shareText(settings.restaurantName, cardText(), 'Carte copiée');
  else if (act === 'edit') { $('cardModalBg').classList.remove('show'); $('settingsHeaderBtn').click(); }
});
$('ticketModalBg').addEventListener('click', e => {
  if (e.target === $('ticketModalBg')) { $('ticketModalBg').classList.remove('show'); return; }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'close') $('ticketModalBg').classList.remove('show');
  else if (act === 'print') printTicketNow();
  else if (act === 'share' && journal[ticketIndex]) shareText('Commande ' + fmtNum(journal[ticketIndex].number), orderText(journal[ticketIndex]), 'Ticket copié');
});

/* ---------- MODE APP (hors ligne) ---------- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

/* ---------- INIT ---------- */
applySettings();
renderProducts();
renderCart();
</script>
</body>
</html>
